name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & Test & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: TypeScript check (server)
        run: npm run build -w packages/server

      - name: TypeScript check (client)
        run: npm run build -w packages/client

      - name: Run server tests
        run: npm run test -w packages/server
        env:
          NODE_ENV: test
          DATABASE_URL: file:./test.db

      - name: Run client tests
        run: npm run test -w packages/client
        env:
          NODE_ENV: test

      - name: Upload coverage (server)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-server
          path: packages/server/coverage/
          retention-days: 7

      - name: Upload coverage (client)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-client
          path: packages/client/coverage/
          retention-days: 7

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          push: false
          tags: hotradar/server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build client image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/client/Dockerfile
          push: false
          tags: hotradar/client:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
